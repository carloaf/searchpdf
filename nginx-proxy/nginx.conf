events {
    worker_connections 1024;
}

http {
    # MIME types essenciais
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'host="$host" proto="$http_x_forwarded_proto"';

    access_log /dev/stdout main;

    upstream saga {
        server saga_app_dev:80;
    }
    
    upstream searchpdf {
        server searchpdf_app:80;
    }

    # SearchPDF via DNS https://sipbo.11dsup.eb.mil.br (porta 443)
    #
    # O proxy externo (10.166.72.33 / pr1207.7cta.eb.mil.br) termina o TLS do
    # cliente (certificado *.11dsup.eb.mil.br) e encaminha a requisição para
    # 10.166.72.36:443 (HTTPS de backend). Sem este listener 443 o proxy
    # externo recebe "connection refused" e responde ao navegador com
    # "empty reply" — exatamente o sintoma de não conseguir acessar via HTTPS.
    #
    # O certificado aqui pode ser autoassinado, pois o TLS que o usuário vê no
    # navegador já é garantido pelo proxy externo.
    server {
        listen 443 ssl;
        server_name sipbo.11dsup.eb.mil.br;

        ssl_certificate     /etc/nginx/certs/sipbo.crt;
        ssl_certificate_key /etc/nginx/certs/sipbo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://searchpdf;
            # Força o host do DNS para que a aplicação gere links corretos
            proxy_set_header Host sipbo.11dsup.eb.mil.br;
            proxy_set_header X-Forwarded-Host sipbo.11dsup.eb.mil.br;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # SAGA via HTTPS (padrão) + SearchPDF via /searchpdf/ (fallback)
    # Espelha o comportamento da porta 80 para que https://saga... e
    # https://10.166.72.36/ continuem servindo o SAGA (e não o SearchPDF).
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/sipbo.crt;
        ssl_certificate_key /etc/nginx/certs/sipbo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://saga;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /searchpdf/ {
            rewrite ^/searchpdf(.*)$ $1 break;
            proxy_pass http://searchpdf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /searchpdf;
        }

        location = /searchpdf {
            return 301 /searchpdf/;
        }
    }

    # SearchPDF via DNS http://sipbo.11dsup.eb.mil.br (porta 80 - fallback)
    # O proxy externo (10.166.72.33) pode rotear para porta 80 com Host: sipbo
    server {
        listen 80;
        server_name sipbo.11dsup.eb.mil.br;
        
        location / {
            proxy_pass http://searchpdf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
    
    # SAGA via IP (padrão) + SearchPDF via /searchpdf/ (fallback)
    # http://10.166.72.36/ → SAGA
    # http://10.166.72.36/searchpdf/ → SearchPDF
    server {
        listen 80 default_server;
        server_name _;
        
        location / {
            proxy_pass http://saga;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        
        location /searchpdf/ {
            rewrite ^/searchpdf(.*)$ $1 break;
            proxy_pass http://searchpdf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /searchpdf;
        }
        
        location = /searchpdf {
            return 301 /searchpdf/;
        }
    }
}
